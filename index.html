<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#0d6efd">

    <meta name="description"
          content="Daily Expense Tracker - Record and monitor your daily expenses">

    <title>Daily Expense Tracker</title>


    <!-- =====================================================
         FAVICON
    ====================================================== -->

    <link rel="icon"
          type="image/png"
          href="https://i.pinimg.com/736x/ff/e5/c8/ffe5c8bfff56af5eb39a3f13dd4bde26.jpg">


    <!-- =====================================================
         BOOTSTRAP
    ====================================================== -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <!-- =====================================================
         CUSTOM CSS
    ====================================================== -->

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


<!-- =========================================================
     HEADER
========================================================== -->

<header class="header-section">

    <div class="container">

        <div class="header-content">

            <div class="header-title-area">

                <h2>

                    <i class="fa-solid fa-indian-rupee-sign"></i>

                    Daily Expense Monitor

                </h2>

                <p>
                    Record and monitor your daily expenses
                </p>

            </div>


            <div class="date-display"
                 id="currentDate">

            </div>

        </div>

    </div>

</header>



<!-- =========================================================
     MAIN
========================================================== -->

<main class="container main-container">


    <div class="expense-card">


        <form id="expenseForm"
              novalidate>


            <div class="row g-3">


                <!-- =================================================
                     SERIAL NUMBER
                ================================================== -->

                <div class="col-12 col-md-4">

                    <label class="form-label">
                        Serial No.
                    </label>

                    <input type="text"
                           class="form-control"
                           id="serialNo"
                           readonly>

                </div>



                <!-- =================================================
                     CREATOR
                ================================================== -->

                <div class="col-12 col-md-4">

                    <label class="form-label">

                        Creator

                        <span class="required-star">*</span>

                    </label>

                    <input type="text"
                           class="form-control"
                           id="creator"
                           placeholder="Enter creator name"
                           autocomplete="name"
                           maxlength="100"
                           required>

                </div>



                <!-- =================================================
                     DATE
                ================================================== -->

                <div class="col-12 col-md-4">

                    <label class="form-label">

                        Date

                        <span class="required-star">*</span>

                    </label>

                    <input type="date"
                           class="form-control"
                           id="expenseDate"
                           required>

                </div>



                <!-- =================================================
                     TIME
                ================================================== -->

                <div class="col-12 col-md-4">

                    <label class="form-label">
                        Time
                    </label>

                    <input type="time"
                           class="form-control"
                           id="expenseTime">

                </div>



                <!-- =================================================
                     EXPENSE TYPE
                ================================================== -->

                <div class="col-12 col-md-4">

                    <label class="form-label">

                        Expense Type

                        <span class="required-star">*</span>

                    </label>


                    <div class="input-group">


                        <select class="form-select"
                                id="expenseType"
                                required>

                            <option value="">
                                Loading expense types...
                            </option>

                        </select>


                        <button type="button"
                                class="btn btn-outline-primary"
                                id="addExpenseTypeBtn"
                                title="Add New Expense Type">

                            <i class="fa-solid fa-plus"></i>

                            <span>Add</span>

                        </button>


                    </div>

                </div>



                <!-- =================================================
                     CATEGORY
                ================================================== -->

                <div class="col-12 col-md-4">

                    <label class="form-label">

                        Category

                        <span class="required-star">*</span>

                    </label>

                    <select class="form-select"
                            id="category"
                            required>

                        <option value="">
                            Select Category
                        </option>

                        <option value="Electric Things">
                            Electric Things
                        </option>

                        <option value="Plumbing Things">
                            Plumbing Things
                        </option>

                        <option value="Mesthiry">
                            Mesthiry
                        </option>

                        <option value="Breakfast">
                            Breakfast
                        </option>

                        <option value="Lunch">
                            Lunch
                        </option>

                        <option value="Dinner">
                            Dinner
                        </option>

                        <option value="Transport">
                            Transport
                        </option>

                        <option value="Accommodation">
                            Accommodation
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>



                <!-- =================================================
                     DESCRIPTION
                ================================================== -->

                <div class="col-12 col-lg-8">

                    <label class="form-label">

                        Description

                        <span class="required-star">*</span>

                    </label>

                    <textarea class="form-control"
                              id="comment"
                              rows="3"
                              placeholder="Enter expense details..."
                              maxlength="1000"
                              required></textarea>

                </div>



                <!-- =================================================
                     AMOUNT
                ================================================== -->

                <div class="col-12 col-lg-4">

                    <label class="form-label">

                        Amount

                        <span class="required-star">*</span>

                    </label>


                    <div class="amount-input">

                        <span>₹</span>

                        <input type="number"
                               class="form-control"
                               id="amount"
                               placeholder="0.00"
                               min="0.01"
                               step="0.01"
                               inputmode="decimal"
                               required>

                    </div>

                </div>


            </div>



            <!-- =================================================
                 BUTTON AREA
            ================================================== -->

            <div class="button-area">


                <button type="submit"
                        class="btn btn-primary submit-btn"
                        id="submitExpenseBtn">

                    <i class="fa-solid fa-floppy-disk"></i>

                    Submit Expense

                </button>


                <button type="button"
                        class="btn btn-success view-btn"
                        onclick="goToExpenses()">

                    <i class="fa-solid fa-table-list"></i>

                    View Expenses

                </button>


                <button type="button"
                        class="btn dashboard-btn"
                        onclick="goToDashboard()">

                    <i class="fa-solid fa-chart-column"></i>

                    Dashboard

                </button>


            </div>


        </form>


    </div>


</main>



<!-- =========================================================
     ADD EXPENSE TYPE MODAL
========================================================== -->

<div class="modal fade"
     id="addExpenseTypeModal"
     tabindex="-1"
     aria-hidden="true">


    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">


            <div class="modal-header">

                <h5 class="modal-title">

                    <i class="fa-solid fa-tags text-primary"></i>

                    Add New Expense Type

                </h5>


                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close">

                </button>

            </div>


            <div class="modal-body">


                <label for="newExpenseType"
                       class="form-label">

                    Expense Type

                </label>


                <input type="text"
                       id="newExpenseType"
                       class="form-control"
                       placeholder="Example: House Maintenance"
                       maxlength="100"
                       autocomplete="off">


                <div class="form-text">

                    Enter a new expense type.

                </div>


                <div id="expenseTypeError"
                     class="text-danger mt-2"
                     style="display:none;">

                </div>


            </div>


            <div class="modal-footer">


                <button type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                    Cancel

                </button>


                <button type="button"
                        class="btn btn-primary"
                        id="saveExpenseTypeBtn">

                    <i class="fa-solid fa-plus"></i>

                    Add Expense Type

                </button>


            </div>


        </div>

    </div>

</div>



<!-- =========================================================
     SUCCESS TOAST
========================================================== -->

<div class="toast-container position-fixed bottom-0 end-0 p-3">

    <div id="successToast"
         class="toast"
         role="alert"
         aria-live="assertive"
         aria-atomic="true">

        <div class="toast-header">

            <i class="fa-solid fa-circle-check text-success me-2"></i>

            <strong class="me-auto">
                Success
            </strong>


            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="toast">

            </button>

        </div>


        <div class="toast-body"
             id="successToastMessage">

            Expense saved successfully!

        </div>

    </div>

</div>



<!-- =========================================================
     ERROR TOAST
========================================================== -->

<div class="toast-container position-fixed bottom-0 end-0 p-3">

    <div id="errorToast"
         class="toast"
         role="alert"
         aria-live="assertive"
         aria-atomic="true">

        <div class="toast-header">

            <i class="fa-solid fa-circle-exclamation text-danger me-2"></i>

            <strong class="me-auto">
                Error
            </strong>


            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="toast">

            </button>

        </div>


        <div class="toast-body"
             id="errorToastMessage">

            Something went wrong.

        </div>

    </div>

</div>

<!-- =========================================================
     SUPABASE
========================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- =========================================================
     BOOTSTRAP
========================================================== -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


<!-- =========================================================
     MAIN JAVASCRIPT
========================================================== -->

<script src="script.js"></script>


</body>

</html>
